name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck -x entrypoint.sh scripts/*.sh utils/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^REPO_NAME=$/REPO_NAME=ci-world/' .env
          docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: minecraft-backup:ci
