services:
  minecraft:
    image: minecraft-backup:latest
    build:
      context: .
      args:
        MC_IMAGE_TAG: "${MC_IMAGE_TAG:-java25}"
    container_name: minecraft
    restart: unless-stopped
    # Time for the server to stop cleanly plus the final backup push.
    stop_grace_period: 3m
    tty: true
    stdin_open: true
    ports:
      - "${MC_HOST_PORT:-25565}:25565"
    env_file:
      - .env
    environment:
      EULA: "TRUE"
      TYPE: "${TYPE:-VANILLA}"
      VERSION: "${VERSION:-LATEST}"
      LEVEL: "${REPO_NAME:?Set REPO_NAME in .env}"
      MEMORY: "${MEMORY:-4G}"
      ENABLE_RCON: "true"
    volumes:
      - ./data:/data
      - ./logs:/var/log/mc-scripts
